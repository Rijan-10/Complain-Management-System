<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kathmandu Valley CMS</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:white;
}

.logo-section{
    position:absolute;
    top:15px;
    left:20px;

    display:flex;
    align-items:center;

    width:420px;
    max-width: calc(100vw - 240px);
}

.logo-section img{
    width:110px;
    height:auto;
    margin-right:15px;
}

.logo-text h1{
    color:#0B2D6D;
    font-size:16px;
    font-weight:800;
    margin-bottom:8px;
}

.logo-text h2{
    color:#555;
    font-size:11px;
    font-weight:500;
    font-weight:bold;
    letter-spacing:1px;
    margin-bottom:10px;
}

.logo-text p{
    color:#1E64C8;
    font-size:11px;
    font-weight:600;
    font-weight:bold;
}

.buttons{
    position: absolute;
    top: 30px;
    right: 20px;

    display: flex;
    gap: 6px;
}

.buttons button{
    background: transparent;
    border: none;
    color: #0B2D6D;
    font-size: 14px;
    font-weight: bold;
    padding: 6px 12px;
    cursor: pointer;
    transition: 0.3s;
    border-radius: 6px;
}

.buttons button:hover{
    background-color: #0B2D6D;
    color: white;
}

</style>

</head>

<body>

<div class="logo-section">
    <img src="logo.png" alt="Logo">
    <div class="logo-text">
        <h1>KATHMANDU VALLEY</h1>
        <h2>COMPLAINT MANAGEMENT SYSTEM</h2>
        <p>Report, Track and Resolve Together for a Better Valley</p>
    </div>
</div>

<div class="buttons">
    <button>Home</button>
    <button>About</button>
    <button>Contact Us</button>
</div>

</body>
</html>
