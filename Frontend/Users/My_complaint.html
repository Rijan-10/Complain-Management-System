<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS New Complaint</title>
 
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}
 
body{
    background:white;
}

.top-header{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 25px;
    background: white;
    border-bottom: 1px solid #E4E7EB;
    min-height: 130px;
}
 
.logo-section{
    display:flex;
    align-items:center;
}
 
@media (max-width: 480px){
    .top-header{
        flex-wrap:wrap;
        height:auto;
        padding:15px 15px 90px;
    }
    .logo-section{
        position:static;
        width:100%;
        max-width:100%;
        margin-bottom:10px;
    }
    .user-info{
        margin-left:auto;
    }
}
 
.logo-section img{
    width:110px;
    height:auto;
    margin-right:15px;
}
 
.logo-text h1{
    color:#0B2D6D;
    font-size:16px;
    font-weight:800;
    margin-bottom:8px;
}
 
.logo-text h2{
    color:#555;
    font-size:11px;
    font-weight:500;
    font-weight:bold;
    letter-spacing:1px;
    margin-bottom:10px;
}
 
.logo-text p{
    color:#1E64C8;
    font-size:11px;
    font-weight:600;
    font-weight:bold;
}

.user-info{
    display:flex;
    align-items:center;
    gap:12px;
    padding:8px 16px;
    border-radius:8px;
    cursor:pointer;
    transition:background 0.2s ease;
}
 
.user-info:hover{
    background:#E8F0FE;
}
 
.profile-placeholder{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#E4E8EE;
    border:1px solid #C9CFD8;
    flex-shrink:0;
}
 
.user-info span{
    font-size:15px;
    color:#333;
}
.wrapper{
    display:flex;
    align-items:flex-start;
}
 
.sidebar{
    width:270px;
    min-height:calc(100vh - 130px);
    border-right:1px solid #E4E7EB;
    background:white;
    padding:25px 15px;
}
 
.nav-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 18px;
    border-radius:8px;
    margin-bottom:6px;
    font-weight:bold;
    font-size:15px;
    color:#1A1A1A;
    cursor:pointer;
    transition:background 0.2s ease, color 0.2s ease;
}
 
.nav-item svg{
    stroke:#1A1A1A;
    transition:stroke 0.2s ease;
    flex-shrink:0;
}
 
.nav-item:hover{
    background:#E8F0FE;
    color:#1E64C8;
}
 
.nav-item:hover svg{
    stroke:#1E64C8;
}

/* Main Body */

.main-content{
    flex:1;
    padding:25px;
    background:#F7F9FC;
    min-height:calc(100vh - 130px);
}

.content-card{
    background:#fff;
    border:1px solid #E4E7EB;
    border-radius:12px;
    padding:22px;
    box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

.page-title{
    color:#173F82;
    font-size:38px;
    font-weight:700;
    margin-bottom:20px;
}

/* Table */

.table-container{
    width:100%;
    overflow-x:auto;
}

.complaints-table{
    width:100%;
    border-collapse:collapse;
}

.complaints-table thead{
    border-bottom:2px solid #E4E7EB;
}

.complaints-table th{
    padding:16px;
    text-align:center;
    font-size:17px;
    color:#333;
    font-weight:700;
}

.complaints-table td{
    padding:16px;
    text-align:center;
    border-bottom:1px solid #EAEAEA;
    font-size:16px;
    color:#222;
}

/* Status Badges */

.status-progress,
.status-resolved,
.status-closed{
    display:inline-block;
    min-width:120px;
    padding:10px 18px;
    border-radius:12px;
    color:white;
    font-weight:bold;
    text-align:center;
    cursor:default;   /* not editable */
    user-select:none; /* cannot select/edit */
}

.status-progress{
    background:#FF7A1A;
}

.status-resolved{
    background:#0BC15D;
}

.status-closed{
    background:#111;
}

/* View Button */

.view-btn{
    background:#2F6FE4;
    color:white;
    border:none;
    padding:10px 28px;
    border-radius:12px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:0.25s;
}

.view-btn:hover{
    background:#174FB5;
    transform:translateY(-2px);
    box-shadow:0 6px 14px rgba(47,111,228,.35);
}

.view-btn:active{
    transform:scale(.97);
}
 

</style>
</head>
<body>
 
<div class="top-header">
    <div class="logo-section">
        <img src="logo.png" alt="Logo">
        <div class="logo-text">
            <h1>KATHMANDU VALLEY</h1>
            <h2>COMPLAINT MANAGEMENT SYSTEM</h2>
            <p>Report, Track and Resolve Together for a Better Valley</p>
        </div>
    </div>
 
    <div class="user-info">
        <div class="profile-placeholder"></div>
        <span>Hello, User</span>
    </div>
</div>
 
<div class="wrapper">
    <div class="sidebar">
        <div class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
            Dashboard
        </div>
        <div class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            New Complaint
        </div>
        <div class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg>
            My Complaints
        </div>
        <div class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
            Profile
        </div>
        <div class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            Change Password
        </div>
    </div>
    <div class="main-content">

    <div class="content-card">

        <h2 class="page-title">My Complaints</h2>

        <div class="table-container">
            <table class="complaints-table">

                <thead>
                    <tr>
                        <th>Complaint ID</th>
                        <th>Subject</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>

                    <!--
                        Django Backend Example

                        {% for complaint in complaints %}
                        <tr>
                            <td>{{ complaint.complaint_id }}</td>
                            <td>{{ complaint.subject }}</td>
                            <td>{{ complaint.date }}</td>

                            <td>
                                <span class="
                                    {% if complaint.status == 'In Progress' %}
                                        status-progress
                                    {% elif complaint.status == 'Resolved' %}
                                        status-resolved
                                    {% else %}
                                        status-closed
                                    {% endif %}
                                ">
                                    {{ complaint.status }}
                                </span>
                            </td>

                            <td>
                                <a href="#" class="view-btn">View</a>
                            </td>
                        </tr>
                        {% endfor %}
                    -->
                    
                
                    
                </tbody>

            </table>
        </div>

    </div>

</div>
</div>

</body>
</html>
