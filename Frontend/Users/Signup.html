<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS Signup Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}
:root{
  --navy:#163B6D;
  --blue:#2F6FED;
  --blue-dark:#1D53C9;
  --page-bg:#EEF1F6;
  --card-bg:#ffffff;
  --input-bg:#ECECEC;
  --text:#1F2937;
  --label:#374151;
  --placeholder:#8B93A1;
  --error:#E23D3D;
  --illustration-bg:#E8F0FE;
}
*{box-sizing:border-box;}
body{
    background:white;
    margin:0;
    font-family:'Poppins',sans-serif;
    background:var(--page-bg);
    padding:24px;
}

.logo-section{
    position:absolute;
    top:15px;
    left:20px;

    display:flex;
    align-items:center;

    width:min(420px, calc(100vw - 170px));
}

.logo-section img{
    width: 110px;
    height:auto;
    margin-right:12px;
}

.logo-text h1{
    color:#0B2D6D;
    font-size:16px;
    font-weight:800;
    margin-bottom:8px;
}

.logo-text h2{
    color:#555;
    font-size:11px;
    font-weight:500;
    font-weight:bold;
    letter-spacing:1px;
    margin-bottom:10px;
}

.logo-text p{
    color:#1E64C8;
    font-size:11px;
    font-weight:600;
    font-weight:bold;
}
.auth-card{
  position:relative;
  width:100%;
  max-width:1100px;
  margin:0 auto;
  padding-top:56px;
  display:flex;
  gap:48px;
}
.login-link-top{
  position:absolute;
  top:24px;
  right:24px;
  color:var(--blue);
  font-weight:600;
  font-size:14px;
  text-decoration:none;
  cursor:pointer;
}
.login-link-top:hover{
  text-decoration:underline;
}
.illustration-col{
  flex:1;
  min-width:260px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.illustration-placeholder{
  width:100%;
  max-width:380px;
  aspect-ratio:4/5;
  background:var(--illustration-bg);
  border-radius:48px 48px 48px 48px/60px 60px 60px 60px;
}
.form-col{
  flex:1;
  min-width:320px;
  display:flex;
  flex-direction:column;
  background:var(--card-bg);
  border-radius:24px;
  box-shadow:0 20px 60px rgba(22,59,109,0.12);
  padding:40px 44px 44px;
}
.title{
  color:var(--navy);
  font-size:28px;
  font-weight:700;
  margin:0 0 8px 0;
}
.subtitle{
  color:#55607A;
  font-size:15px;
  margin:0 0 26px 0;
}
.field{
  margin-bottom:18px;
}
.field label{
  display:block;
  font-size:14px;
  color:var(--label);
  font-weight:500;
  margin-bottom:8px;
}
.input-wrapper{
  position:relative;
  display:flex;
  align-items:center;
  background:var(--input-bg);
  border-radius:10px;
  border:1.5px solid transparent;
  transition:border-color .2s ease, background .2s ease;
}
.input-wrapper.error{
  border-color:var(--error);
  background:#FDEDED;
}
.input-wrapper .leading-icon{
  margin-left:14px;
  color:#6B7280;
  width:20px;
  height:20px;
  flex-shrink:0;
}
.input-wrapper input{
  flex:1;
  min-width:0;
  border:none;
  outline:none;
  background:transparent;
  padding:14px 12px;
  font-size:15px;
  font-family:inherit;
  color:var(--text);
}
.input-wrapper input::placeholder{
  color:var(--placeholder);
}
.toggle-eye-btn{
  background:none;
  border:none;
  cursor:pointer;
  margin-right:12px;
  padding:4px;
  color:#6B7280;
  display:flex;
  align-items:center;
}
.toggle-eye-btn svg{
  width:20px;
  height:20px;
}
.error-message{
  display:none;
  color:var(--error);
  font-size:13px;
  margin-top:6px;
}
.error-message.show{
  display:block;
}
.register-btn{
  margin-top:10px;
  width:100%;
  padding:15px;
  border:none;
  border-radius:10px;
  background:var(--blue);
  color:#fff;
  font-size:16px;
  font-weight:600;
  font-family:inherit;
  cursor:pointer;
  transition:background .25s ease, box-shadow .25s ease, transform .15s ease;
}
.register-btn:hover{
  background:var(--blue-dark);
  box-shadow:0 10px 24px rgba(47,111,237,0.35);
  transform:translateY(-2px);
}
.register-btn:active{
  transform:translateY(0);
}
.login-bottom{
  text-align:center;
  margin-top:20px;
  font-size:14px;
  color:#55607A;
}
.login-bottom a{
  color:var(--blue);
  font-weight:600;
  text-decoration:none;
  cursor:pointer;
}
.login-bottom a:hover{
  text-decoration:underline;
}
@media (max-width:860px){
  .auth-card{
    flex-direction:column;
    padding-top:44px;
  }
  .logo-section{
    position:relative;
    top:0;
    left:0;
    width:100%;
    max-width:100%;
    margin-bottom:10px;
  }
  .login-link-top{
    top:20px;
    right:24px;
  }
  .illustration-col{
    display:none;
  }
  .form-col{
    padding-top:36px;
  }
}
</style>
</head>
<body>
<div class="logo-section">
    <img src="logo.png" alt="Logo">
    <div class="logo-text">
        <h1>KATHMANDU VALLEY</h1>
        <h2>COMPLAINT MANAGEMENT SYSTEM</h2>
        <p>Report, Track and Resolve Together for a Better Valley</p>
    </div>
</div>
<div class="auth-card">
  
 
  <div class="illustration-col">
    <div class="illustration-placeholder"></div>
  </div>
 
  <div class="form-col">
    <h1 class="title">Create New Account</h1>
    <p class="subtitle">Register to submit and track your complaints.</p>
 
    <form id="registerForm" novalidate>
      <div class="field">
        <label for="fullName">Full name</label>
        <div class="input-wrapper">
          <svg class="leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path></svg>
          <input type="text" id="fullName" placeholder="Enter your full name" autocomplete="name">
        </div>
      </div>
 
      <div class="field">
        <label for="email">Email Address</label>
        <div class="input-wrapper" id="emailWrapper">
          <svg class="leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
          <input type="text" id="email" placeholder="Enter your email" autocomplete="email">
        </div>
        <div class="error-message" id="emailError">Please enter correct Email</div>
      </div>
 
      <div class="field">
        <label for="phone">Phone Number</label>
        <div class="input-wrapper" id="phoneWrapper">
          <svg class="leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3h3l1.5 4.5-2 1.5a12 12 0 0 0 6 6l1.5-2 4.5 1.5v3a2 2 0 0 1-2 2A16 16 0 0 1 4.5 5a2 2 0 0 1 2-2z"></path></svg>
          <input type="text" id="phone" placeholder="Enter your phone number" inputmode="numeric" autocomplete="tel">
        </div>
        <div class="error-message" id="phoneError">Please enter correct phone number</div>
      </div>
 
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrapper" id="passwordWrapper">
          <svg class="leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="new-password">
          <button type="button" class="toggle-eye-btn" id="togglePassword"></button>
        </div>
      </div>
 
      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrapper" id="confirmPasswordWrapper">
          <svg class="leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
          <input type="password" id="confirmPassword" placeholder="Confirm your password" autocomplete="new-password">
          <button type="button" class="toggle-eye-btn" id="toggleConfirmPassword"></button>
        </div>
        <div class="error-message" id="confirmPasswordError">Please enter correct password</div>
      </div>
 
      <button type="submit" class="register-btn">Register</button>
    </form>
 
    <div class="login-bottom">Already have an account ? <a>Login</a></div>
  </div>
</div>
 
<script>
const eyeOpenIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
const eyeClosedIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M10.6 10.6a3 3 0 0 0 4.24 4.24"></path><path d="M9.9 5.1A10.9 10.9 0 0 1 12 5c7 0 10.5 7 10.5 7a13.5 13.5 0 0 1-3.14 4.14M6.1 6.1C3.6 7.9 1.5 12 1.5 12a13.9 13.9 0 0 0 5.02 5.6"></path></svg>';
 
function setupToggle(buttonId, inputId){
  const btn = document.getElementById(buttonId);
  const input = document.getElementById(inputId);
  btn.innerHTML = eyeClosedIcon;
  btn.addEventListener('click', function(){
    if(input.type === 'password'){
      input.type = 'text';
      btn.innerHTML = eyeOpenIcon;
    } else {
      input.type = 'password';
      btn.innerHTML = eyeClosedIcon;
    }
  });
}
 
setupToggle('togglePassword','password');
setupToggle('toggleConfirmPassword','confirmPassword');
 
const phoneInput = document.getElementById('phone');
const phoneWrapper = document.getElementById('phoneWrapper');
const phoneError = document.getElementById('phoneError');
 
const emailInput = document.getElementById('email');
const emailWrapper = document.getElementById('emailWrapper');
const emailError = document.getElementById('emailError');
 
const passwordInput = document.getElementById('password');
const confirmPasswordInput = document.getElementById('confirmPassword');
const confirmPasswordWrapper = document.getElementById('confirmPasswordWrapper');
const confirmPasswordError = document.getElementById('confirmPasswordError');
 
phoneInput.addEventListener('input', function(){
  phoneInput.value = phoneInput.value.replace(/\D/g,'').slice(0,10);
});
 
function validatePhone(){
  const isValid = /^[0-9]{10}$/.test(phoneInput.value);
  phoneWrapper.classList.toggle('error', !isValid);
  phoneError.classList.toggle('show', !isValid);
  return isValid;
}
 
function validateEmail(){
  const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value.trim());
  emailWrapper.classList.toggle('error', !isValid);
  emailError.classList.toggle('show', !isValid);
  return isValid;
}
 
function validateConfirmPassword(){
  const isValid = confirmPasswordInput.value.length > 0 && confirmPasswordInput.value === passwordInput.value;
  confirmPasswordWrapper.classList.toggle('error', !isValid);
  confirmPasswordError.classList.toggle('show', !isValid);
  return isValid;
}
 
phoneInput.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){
    e.preventDefault();
    if(phoneInput.value.length > 0){
      validatePhone();
    } else {
      phoneWrapper.classList.remove('error');
      phoneError.classList.remove('show');
    }
  }
});
 
emailInput.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){
    e.preventDefault();
    if(emailInput.value.length > 0){
      validateEmail();
    } else {
      emailWrapper.classList.remove('error');
      emailError.classList.remove('show');
    }
  }
});
 
confirmPasswordInput.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){
    e.preventDefault();
    if(confirmPasswordInput.value.length > 0){
      validateConfirmPassword();
    } else {
      confirmPasswordWrapper.classList.remove('error');
      confirmPasswordError.classList.remove('show');
    }
  }
});
 
document.getElementById('fullName').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){
    e.preventDefault();
  }
});
 
passwordInput.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){
    e.preventDefault();
  }
});
 
document.getElementById('registerForm').addEventListener('submit', function(e){
  e.preventDefault();
  const validPhone = validatePhone();
  const validEmail = validateEmail();
  const validConfirm = validateConfirmPassword();
  if(validPhone && validEmail && validConfirm){
    this.submit();
  }
});
</script>
</body>
</html>
