{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kathmandu Valley CMS</title>
<link rel="stylesheet" href="{% static 'css/common.css' %}?v=9">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:white;
}

/* Logout Section */

.logout-container{
    width:85%;
    height:500px;
    margin:150px auto 40px;
    background:#f8fbff;
    border-radius:25px;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:60px;

    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

/* Left side image */
.logout-image{
    width:350px;
    height:350px;

    display:flex;
    justify-content:center;
    align-items:center;
}

.logout-image img{
    width:100%;
    max-width:320px;
}

/* Right side */
.logout-content{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.logout-content h1{
    color:#2f66d8;
    font-size:36px;
    line-height:1.3;
    margin-bottom:40px;
}

/* Buttons */

.logout-buttons{
    display:flex;
    flex-direction:column;
    align-items:center;      /* Centers the buttons horizontally */
    justify-content:center;
    gap:18px;
    width:100%;
}

.logout-buttons button{
    width:270px;
    padding:18px;
    border:none;
    border-radius:12px;
    background:#3d73ea;
    color:white;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.logout-buttons button:hover{
    background:#0B2D6D;
    transform:translateY(-3px);
    box-shadow:0 8px 18px rgba(0,0,0,0.2);
}

/* Optional different hover colors */

.login-btn:hover{
    background:#2458c6;
}

.home-btn:hover{
    background:#173f97;
}
.home-icon{
    font-size:38px;
    margin-right:-4px;
    vertical-align:middle;
    line-height:0;
}
.home-icon{
    font-size:38px;
    display:inline-flex;
    align-items:center;
    position:relative;
    top:-6px;
    left:-2px;
}

/* Responsive */

@media(max-width:900px){

.logout-container{
    flex-direction:column;
    height:auto;
    padding:40px 20px;
    margin-top:170px;
}

.logout-image{
    width:250px;
    height:250px;
}

.logout-content h1{
    font-size:34px;
}

.logout-buttons button{
    width:240px;
    font-size:20px;
}

.home-icon{
    font-size:32px;   /* Increase or decrease as needed */
    margin-right:8px;
    vertical-align:middle;
}

}
</style>
</head>
<body>

{% include 'partials/header.html' %}

{% if last_message %}
<div class="toast-overlay" id="toastOverlay">
    <div class="toast-badge toast-{{ last_message.tags }}">
        <span class="toast-icon">{{ last_message.tags|yesno:'✓,!' }}</span>
        <span class="toast-text">{{ last_message }}</span>
    </div>
<div class="buttons">
    <button>Home</button>
    <button>About</button>
    <button>Contact Us</button>
    <button>Login </button>
</div>
{% endif %}

<div class="logout-container">

    <!-- Leave this space for your logout image -->
    <div class="logout-image">
        <!-- Replace logout-image.png with your image -->
        <img src="{% static 'User_Logged_Out.png' %}" alt="Logged Out">
    </div>

    <div class="logout-content">
        <h1>You have been<br>successfully logged out</h1>

        <div class="logout-buttons">
            <button class="login-btn" onclick="location.href='{% url 'login' %}'">
                &#10227; Login Again
            </button>

            <button class="home-btn" onclick="location.href='{% url 'home' %}'">
                <span class="home-icon">&#8962;</span> Back to Home
            </button>
        </div>
    </div>

</div>
</body>
</html>
