<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS Admin - Manage Users</title>
 
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}
 
body{
    background:white;
}
 
.logo-section{
    position:absolute;
    top:15px;
    left:20px;
 
    display:flex;
    align-items:center;
 
    width:420px;
    max-width: calc(100vw - 160px);
}
 
@media (max-width: 480px){
    .top-header{
        flex-wrap:wrap;
        height:auto;
        padding:15px 15px 90px;
    }
    .logo-section{
        position:static;
        width:100%;
        max-width:100%;
        margin-bottom:10px;
    }
    .user-info{
        margin-left:auto;
    }
}
 
.logo-section img{
    width:110px;
    height:auto;
    margin-right:15px;
}
 
.logo-text h1{
    color:#0B2D6D;
    font-size:16px;
    font-weight:800;
    margin-bottom:8px;
}
 
.logo-text h2{
    color:#555;
    font-size:11px;
    font-weight:500;
    font-weight:bold;
    letter-spacing:1px;
    margin-bottom:10px;
}
 
.logo-text p{
    color:#1E64C8;
    font-size:11px;
    font-weight:600;
    font-weight:bold;
}
 
.top-header{
    position:relative;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    height:110px;
    padding:0 30px;
    background:#F7F8FA;
    border-bottom:1px solid #E4E7EB;
}
 
.user-info{
    display:flex;
    align-items:center;
    gap:12px;
    padding:8px 16px;
    border-radius:8px;
    cursor:pointer;
    transition:background 0.2s ease;
}
 
.user-info:hover{
    background:#E8F0FE;
}
 
.profile-placeholder{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#E4E8EE;
    border:1px solid #C9CFD8;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}
 
.user-info span{
    font-size:15px;
    color:#333;
}
 
.dropdown-arrow{
    flex-shrink:0;
}
 
.wrapper{
    display:flex;
    align-items:flex-start;
}
 
.sidebar{
    width:270px;
    background:white;
    border-right:1px solid #E4E7EB;
    padding:25px 15px;
}
 
.nav-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 18px;
    border-radius:8px;
    margin-bottom:6px;
    font-weight:bold;
    font-size:15px;
    color:#1A1A1A;
    cursor:pointer;
    transition:background 0.2s ease, color 0.2s ease;
    text-decoration:none;
}
 
.nav-item svg{
    stroke:#1A1A1A;
    transition:stroke 0.2s ease;
    flex-shrink:0;
}
 
.nav-item:hover{
    background:#E8F0FE;
    color:#1E64C8;
}
 
.nav-item:hover svg{
    stroke:#1E64C8;
}
 
.nav-item.active{
    background:#E8F0FE;
    color:#1E64C8;
}
 
.nav-item.active svg{
    stroke:#1E64C8;
}
 
.main-content{
    flex:1;
    padding:30px 40px;
    background:#FAFBFC;
    min-height:calc(100vh - 110px);
}
 
.page-title{
    color:#0B2D6D;
    font-size:26px;
    font-weight:800;
    margin-bottom:6px;
}
 
.page-header-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
}
 
.next-arrow{
    cursor:pointer;
    stroke:#0B2D6D;
    flex-shrink:0;
}
 
/* ---- Filter row ---- */
.filters-row{
    display:flex;
    align-items:flex-end;
    gap:18px;
    margin-bottom:25px;
    flex-wrap:wrap;
}
 
.filter-group{
    display:flex;
    flex-direction:column;
    gap:8px;
}
 
.filter-group.search-group{
    flex:1;
    min-width:220px;
}
 
.filter-label{
    font-size:13px;
    color:#333;
    font-weight:600;
}
 
.filter-input, .filter-select{
    height:44px;
    padding:0 16px;
    border:1px solid #D6DAE1;
    border-radius:8px;
    font-size:14px;
    color:#1A1A1A;
    background:white;
    outline:none;
    transition:border-color 0.2s ease;
}
 
.filter-input{
    width:100%;
}
 
.filter-input:focus, .filter-select:focus{
    border-color:#1E64C8;
}
 
.filter-select{
    min-width:170px;
    cursor:pointer;
    appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
    padding-right:38px;
}
 
.enter-btn{
    height:44px;
    padding:0 28px;
    background:#1E64C8;
    color:white;
    border:none;
    border-radius:8px;
    font-weight:800;
    font-size:14px;
    cursor:pointer;
    transition:background 0.2s ease;
}
 
.enter-btn:hover{
    background:#0B2D6D;
}
 
/* ---- Users table card ---- */
.card{
    background:white;
    border:1px solid #E4E7EB;
    border-radius:10px;
    padding:10px 30px 25px;
}
 
.users-table{
    width:100%;
    border-collapse:collapse;
}
 
.users-table thead th{
    text-align:left;
    font-size:14px;
    color:#333;
    font-weight:600;
    padding:16px 8px;
    border-bottom:1px solid #E4E7EB;
}
 
.users-table tbody td{
    padding:16px 8px;
    font-size:14px;
    color:#1A1A1A;
    border-bottom:1px solid #EEF0F3;
}
 
.users-table tbody tr:last-child td{
    border-bottom:none;
}
 
.status-badge{
    display:inline-block;
    width:fit-content;
    font-weight:700;
    font-size:13px;
    padding:6px 16px;
    border-radius:20px;
    text-align:center;
}
 
.status-badge.status-active{
    background:#D9F5DF;
    color:#1F8A4C;
}
 
.status-badge.status-inactive{
    background:#E4E7EB;
    color:#1A1A1A;
}
 
.action-icons{
    display:flex;
    align-items:center;
    gap:14px;
}
 
.action-icons svg{
    cursor:pointer;
}
 
.edit-icon{
    stroke:#1E64C8;
}
 
.more-icon{
    stroke:#555;
}
 
.empty-state{
    padding:40px 0;
    text-align:center;
    color:#8A93A3;
    font-size:14px;
}
 
@media (max-width:600px){
    .users-table{
        display:block;
        overflow-x:auto;
    }
}
</style>
</head>
<body>
 
<div class="top-header">
    <div class="logo-section">
        <img src="logo.png" alt="Logo">
        <div class="logo-text">
            <h1>KATHMANDU VALLEY</h1>
            <h2>COMPLAINT MANAGEMENT SYSTEM</h2>
            <p>Report, Track and Resolve Together for a Better Valley</p>
        </div>
    </div>
 
    <div class="user-info">
        <div class="profile-placeholder">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A93A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        </div>
        <span>Admin CMS</span>
        <svg class="dropdown-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
</div>
 
<div class="wrapper">
    <div class="sidebar">
        <a href="Dashboard.html" class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
            Dashboard
        </a>
        <a href="Users.html" class="nav-item active">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 2.9-6.5 6.5-6.5S15.5 16.4 15.5 20"/><circle cx="17.5" cy="9" r="2.6"/><path d="M15 13.2c2.9.4 5 2.7 5 6.8"/></svg>
            Users
        </a>
        <a href="Complaints.html" class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg>
            Complaints
        </a>
        <a href="Reports.html" class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M8 12h3M8 16h8M8 8h8"/></svg>
            Reports
        </a>
        <a href="Settings.html" class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1z"/></svg>
            Settings
        </a>
        <a href="Profile.html" class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
            Profile
        </a>
    </div>
 
    <div class="main-content">
 
        <div class="page-header-row">
            <h1 class="page-title">Manage Users</h1>
            <svg class="next-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </div>
 
        <div class="filters-row">
            <div class="filter-group search-group">
                <span class="filter-label">Search Users</span>
                <input type="text" class="filter-input" id="searchUsersInput" placeholder="Search Users">
            </div>
 
            <div class="filter-group">
                <span class="filter-label">Status</span>
                <select class="filter-select" id="statusFilter">
                    <option value="">All Status</option>
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>
 
            <button type="button" class="enter-btn" id="enterBtn">Enter</button>
        </div>
 
        <!-- ===================== USERS TABLE ====================== -->
        <div class="card">
            <table class="users-table">
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Joined On</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
 
                </tbody>
            </table>
 
            <!-- Shown only when there is no data yet / table body is empty -->
            <div class="empty-state" id="emptyState">
                User Information will be displayed here.
            </div>
        </div>
 
    </div>
</div>
 
<script>
 
// Toggle empty-state message based on whether the table has rows.
function updateEmptyState(){
    const tbody = document.getElementById("usersTableBody");
    const emptyState = document.getElementById("emptyState");
    emptyState.style.display = tbody.children.length === 0 ? "block" : "none";
}
updateEmptyState();
 
document.getElementById("enterBtn").addEventListener("click", function(){
    });
</script>
</body>
</html>
