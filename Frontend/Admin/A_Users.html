{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS Admin - Manage Users</title>
<link rel="stylesheet" href="{% static 'css/common.css' %}">

<style>
.main-content{
    flex:1;
    padding:30px 40px;
    background:#FAFBFC;
    min-height:calc(100vh - 110px);
}
 
.page-title{
    color:#0B2D6D;
    font-size:26px;
    font-weight:800;
    margin-bottom:6px;
}
 
.page-header-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
}
 
.next-arrow{
    cursor:pointer;
    stroke:#0B2D6D;
    flex-shrink:0;
}
 
/* ---- Filter row ---- */
.filters-row{
    display:flex;
    align-items:flex-end;
    gap:18px;
    margin-bottom:25px;
    flex-wrap:wrap;
}
 
.filter-group{
    display:flex;
    flex-direction:column;
    gap:8px;
}
 
.filter-group.search-group{
    flex:1;
    min-width:220px;
}
 
.filter-label{
    font-size:13px;
    color:#333;
    font-weight:600;
}
 
.filter-input, .filter-select{
    height:44px;
    padding:0 16px;
    border:1px solid #D6DAE1;
    border-radius:8px;
    font-size:14px;
    color:#1A1A1A;
    background:white;
    outline:none;
    transition:border-color 0.2s ease;
}
 
.filter-input{
    width:100%;
}
 
.filter-input:focus, .filter-select:focus{
    border-color:#1E64C8;
}
 
.filter-select{
    min-width:170px;
    cursor:pointer;
    appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
    padding-right:38px;
}
 
.enter-btn{
    height:44px;
    padding:0 28px;
    background:#1E64C8;
    color:white;
    border:none;
    border-radius:8px;
    font-weight:800;
    font-size:14px;
    cursor:pointer;
    transition:background 0.2s ease;
}
 
.enter-btn:hover{
    background:#0B2D6D;
}
 
/* ---- Users table card ---- */
.card{
    background:white;
    border:1px solid #E4E7EB;
    border-radius:10px;
    padding:10px 30px 25px;
}
 
.users-table{
    width:100%;
    border-collapse:collapse;
}
 
.users-table thead th{
    text-align:left;
    font-size:14px;
    color:#333;
    font-weight:600;
    padding:16px 8px;
    border-bottom:1px solid #E4E7EB;
}
 
.users-table tbody td{
    padding:16px 8px;
    font-size:14px;
    color:#1A1A1A;
    border-bottom:1px solid #EEF0F3;
}
 
.users-table tbody tr:last-child td{
    border-bottom:none;
}
 
.status-badge{
    display:inline-block;
    width:fit-content;
    font-weight:700;
    font-size:13px;
    padding:6px 16px;
    border-radius:20px;
    text-align:center;
}
 
.status-badge.status-active{
    background:#D9F5DF;
    color:#1F8A4C;
}
 
.status-badge.status-inactive{
    background:#E4E7EB;
    color:#1A1A1A;
}
 
.action-icons{
    display:flex;
    align-items:center;
    gap:14px;
}
 
.action-icons svg{
    cursor:pointer;
}
 
.edit-icon{
    stroke:#1E64C8;
}
 
.more-icon{
    stroke:#555;
}
 
.empty-state{
    padding:40px 0;
    text-align:center;
    color:#8A93A3;
    font-size:14px;
}
 
@media (max-width:600px){
    .users-table{
        display:block;
        overflow-x:auto;
    }
}
</style>
</head>
<body>
 
{% include 'partials/header.html' %}

<div class="wrapper">
    {% include 'partials/admin_sidebar.html' with active='users' %}

    <div class="main-content">
 
        <div class="page-header-row">
            <h1 class="page-title">Manage Users</h1>
            <svg class="next-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </div>
 
        <div class="filters-row">
            <div class="filter-group search-group">
                <span class="filter-label">Search Users</span>
                <input type="text" class="filter-input" id="searchUsersInput" placeholder="Search Users">
            </div>
 
            <div class="filter-group">
                <span class="filter-label">Status</span>
                <select class="filter-select" id="statusFilter">
                    <option value="">All Status</option>
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>
 
            <button type="button" class="enter-btn" id="enterBtn">Enter</button>
        </div>
 
        <!-- ===================== USERS TABLE ====================== -->
        <div class="card">
            <table class="users-table">
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Joined On</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
 
                </tbody>
            </table>
 
            <!-- Shown only when there is no data yet / table body is empty -->
            <div class="empty-state" id="emptyState">
                User Information will be displayed here.
            </div>
        </div>
 
    </div>
</div>
 
<script>
 
// Toggle empty-state message based on whether the table has rows.
function updateEmptyState(){
    const tbody = document.getElementById("usersTableBody");
    const emptyState = document.getElementById("emptyState");
    emptyState.style.display = tbody.children.length === 0 ? "block" : "none";
}
updateEmptyState();
 
document.getElementById("enterBtn").addEventListener("click", function(){
    });
</script>
</body>
</html>
