{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS Admin Dashboard</title>
<link rel="stylesheet" href="{% static 'css/common.css' %}">

<style>
.main-content{
    flex:1;
    padding:30px 40px;
    background:#FAFBFC;
    min-height:calc(100vh - 110px);
}
 
.page-title{
    color:#0B2D6D;
    font-size:26px;
    font-weight:800;
    margin-bottom:6px;
}
 
.page-header-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
}
 
.next-arrow{
    cursor:pointer;
    stroke:#0B2D6D;
    flex-shrink:0;
}
 
/* ---- Stat cards ---- */
.stats-row{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:20px;
    margin-bottom:25px;
}
 
.stat-card{
    background:white;
    border:1px solid #E4E7EB;
    border-radius:10px;
    padding:20px 22px;
    display:flex;
    flex-direction:column;
    gap:10px;
}
 
.stat-label{
    font-size:14px;
    color:#333;
    font-weight:600;
}
 
.stat-value-row{
    display:flex;
    align-items:baseline;
    gap:10px;
}
 
.stat-value{
    font-size:30px;
    font-weight:800;
    color:#1E64C8;
}
 
.stat-sub{
    font-size:14px;
    color:#333;
    font-weight:600;
}
 
/* Individual stat accent colours (value + change), matching reference figure */
.stat-card.total .stat-value{ color:#1E64C8; }
.stat-card.progress .stat-value{ color:#E8720C; }
.stat-card.resolved .stat-value{ color:#1F8A4C; }
.stat-card.closed .stat-value{ color:#1A1A1A; }
 
/* ---- Recent complaints card ---- */
.card{
    background:white;
    border:1px solid #E4E7EB;
    border-radius:10px;
    padding:25px 30px;
    margin-bottom:20px;
}
 
.card-header-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}
 
.card-title{
    font-size:18px;
    font-weight:800;
    color:#1A1A1A;
}
 
.view-all-btn{
    background:#1E64C8;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    font-weight:800;
    font-size:14px;
    cursor:pointer;
    transition:background 0.2s ease;
}
 
.view-all-btn:hover{
    background:#0B2D6D;
}
 
.complaints-table{
    width:100%;
    border-collapse:collapse;
}
 
.complaints-table thead th{
    text-align:left;
    font-size:14px;
    color:#333;
    font-weight:600;
    padding:10px 8px;
    border-bottom:1px solid #E4E7EB;
}
 
.complaints-table tbody td{
    padding:16px 8px;
    font-size:14px;
    color:#1A1A1A;
    border-bottom:1px solid #EEF0F3;
}
 
.complaints-table tbody tr:last-child td{
    border-bottom:none;
}
 
.status-badge{
    display:inline-block;
    width:fit-content;
    font-weight:700;
    font-size:13px;
    padding:6px 16px;
    border-radius:20px;
    color:white;
    text-align:center;
}
 
.status-badge.status-in-progress{ background:#E8720C; }
.status-badge.status-resolved{ background:#1F8A4C; }
.status-badge.status-closed{ background:#000000; }
 
.empty-state{
    padding:40px 0;
    text-align:center;
    color:#8A93A3;
    font-size:14px;
}
 
@media (max-width:1100px){
    .stats-row{
        grid-template-columns:repeat(2, 1fr);
    }
}
 
@media (max-width:600px){
    .stats-row{
        grid-template-columns:1fr;
    }
    .complaints-table{
        display:block;
        overflow-x:auto;
    }
}
</style>
</head>
<body>
 
{% include 'partials/header.html' %}

<div class="wrapper">
    {% include 'partials/admin_sidebar.html' with active='dashboard' %}

    <div class="main-content">
 
        <div class="page-header-row">
            <h1 class="page-title">Dashboard</h1>
            <svg class="next-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </div>
 
        <div class="stats-row">
 
            <div class="stat-card total">
                <span class="stat-label">Total Complaints</span>
                <div class="stat-value-row">
                    <span class="stat-value" id="totalComplaintsValue"><!-- {{ total_complaints }} --></span>
                </div>
            </div>
 
            <div class="stat-card progress">
                <span class="stat-label">In Progress</span>
                <div class="stat-value-row">
                    <span class="stat-value" id="inProgressValue"><!-- {{ in_progress_count }} --></span>
                </div>
            </div>
 
            <div class="stat-card resolved">
                <span class="stat-label">Resolved</span>
                <div class="stat-value-row">
                    <span class="stat-value" id="resolvedValue"><!-- {{ resolved_count }} --></span>
                </div>
            </div>
 
            <div class="stat-card closed">
                <span class="stat-label">Closed</span>
                <div class="stat-value-row">
                    <span class="stat-value" id="closedValue"><!-- {{ closed_count }} --></span>
                </div>
            </div>
 
        </div>
 
        <!-- ===================== RECENT COMPLAINTS ====================== -->
        <div class="card">
            <div class="card-header-row">
                <h3 class="card-title">Recent Complaints</h3>
                <button type="button" class="view-all-btn" id="viewAllBtn">View All</button>
            </div>
 
            <table class="complaints-table">
                <thead>
                    <tr>
                        <th>Complaint ID</th>
                        <th>Subject</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="recentComplaintsBody">
                    
                </tbody>
            </table>
 
            <!-- Shown only when there is no data yet / table body is empty -->
            <div class="empty-state" id="emptyState">
                Complaint Information will be displayed here.
            </div>
        </div>
 
    </div>
</div>
 
<script>
 
function updateEmptyState(){
    const tbody = document.getElementById("recentComplaintsBody");
    const emptyState = document.getElementById("emptyState");
    emptyState.style.display = tbody.children.length === 0 ? "block" : "none";
}
updateEmptyState();
 
document.getElementById("viewAllBtn").addEventListener("click", function(){
    window.location.href = "Complaints.html";
});
</script>
 </body>
</html>
