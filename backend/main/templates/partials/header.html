{% load static %}
<div class="top-header">
    <div style="display:flex; align-items:center; gap:12px;">
        <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Open menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="logo-section">
            <img src="{% static 'CMS_Logo.png' %}" alt="Logo">
            <div class="logo-text">
                <h1>KATHMANDU VALLEY</h1>
                <h2>COMPLAINT MANAGEMENT SYSTEM</h2>
                <p>Report, Track and Resolve Together for a Better Valley</p>
            </div>
        </div>
    </div>

    <div class="user-menu" id="userMenu">
        <div class="user-info" id="userMenuToggle">
            <div class="profile-placeholder">
                <img src="{% static 'Profile_icon-.png' %}" alt="Profile">
            </div>
            <span>Hello, {{ full_name }}</span>
            <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="user-dropdown" id="userDropdown">
            <a href="{% if is_admin %}{% url 'admin_profile' %}{% else %}{% url 'profile' %}{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
                Profile
            </a>
            <a href="{% if is_admin %}{% url 'admin_change_password' %}{% else %}{% url 'change_password' %}{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                Change Password
            </a>
            <div class="divider"></div>
            <a href="{% if is_admin %}{% url 'admin_logout' %}{% else %}{% url 'logout' %}{% endif %}" class="logout-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                Logout
            </a>
        </div>
    </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="logout-modal-overlay" id="logoutModal">
    <div class="logout-modal-box">
        <div class="logout-modal-icon">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </div>
        <h3>Log out?</h3>
        <p>Are you sure you want to log out of your account?</p>
        <div class="logout-modal-actions">
            <button type="button" class="logout-modal-btn cancel" id="logoutCancel">Cancel</button>
            <button type="button" class="logout-modal-btn confirm" id="logoutConfirm">Log out</button>
        </div>
    </div>
</div>

<script>
window.addEventListener('pageshow', function(event){
    if (event.persisted) {
        window.location.reload();
    }
});
document.addEventListener('DOMContentLoaded', function(){

(function(){
    var userMenu = document.getElementById('userMenu');
    var userMenuToggle = document.getElementById('userMenuToggle');
    if(!userMenu || !userMenuToggle){ return; }
    userMenuToggle.addEventListener('click', function(e){
        e.stopPropagation();
        userMenu.classList.toggle('open');
    });
    document.addEventListener('click', function(e){
        if(!userMenu.contains(e.target)){
            userMenu.classList.remove('open');
        }
    });
})();

(function(){
    var toggle = document.getElementById('mobileMenuToggle');
    var sidebar = document.getElementById('sidebar');
    var overlay = document.getElementById('sidebarOverlay');
    if(!toggle || !sidebar || !overlay){ return; }
    function openMenu(){
        sidebar.classList.add('open');
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
    }
    function closeMenu(){
        sidebar.classList.remove('open');
        overlay.classList.remove('open');
        document.body.style.overflow = '';
    }
    toggle.addEventListener('click', function(){
        if(sidebar.classList.contains('open')){
            closeMenu();
        } else {
            openMenu();
        }
    });
    overlay.addEventListener('click', closeMenu);
    var sidebarLinks = sidebar.querySelectorAll('a');
    var sidebarClose = document.getElementById('sidebarClose');
    sidebarLinks.forEach(function(link){
        link.addEventListener('click', function(){
            closeMenu();
        });
    });
    if(sidebarClose){
        sidebarClose.addEventListener('click', closeMenu);
    }
})();

(function(){
    var overlay = document.getElementById('logoutModal');
    var confirmBtn = document.getElementById('logoutConfirm');
    var cancelBtn = document.getElementById('logoutCancel');
    if(!overlay || !confirmBtn || !cancelBtn){ return; }
    var pendingHref = null;

    function showLogoutModal(href){
        pendingHref = href;
        overlay.classList.add('active');
    }
    function closeLogoutModal(){
        overlay.classList.remove('active');
        pendingHref = null;
    }

    document.addEventListener('click', function(e){
        var link = e.target.closest('a.logout-link, a.logout-btn');
        if(link){
            e.preventDefault();
            showLogoutModal(link.getAttribute('href'));
        }
    });

    confirmBtn.addEventListener('click', function(){
        if(pendingHref){
            window.location.href = pendingHref;
        }
    });
    cancelBtn.addEventListener('click', closeLogoutModal);
    overlay.addEventListener('click', function(e){
        if(e.target === overlay){ closeLogoutModal(); }
    });
    document.addEventListener('keydown', function(e){
        if(e.key === 'Escape'){ closeLogoutModal(); }
    });
})();

});
</script>
